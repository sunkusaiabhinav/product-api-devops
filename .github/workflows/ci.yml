name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Ensure concurrent runs for the same branch/PR cancel previous runs to save CI resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter and formatter checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest test suite
        run: |
          pytest

  build-docker:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: product-api:${{ github.sha }}
          load: true

      - name: Smoke test container execution
        run: |
          # Start the container in background
          docker run -d --name product-api-test -p 8000:8000 product-api:${{ github.sha }}

          # Wait for the service to start
          sleep 5

          # Query health endpoint
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health || exit 1

          # Clean up container
          docker stop product-api-test
          docker rm product-api-test
